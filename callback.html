<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Authorization Complete</title>
<style>
body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; text-align: center; color: #222; }
h1 { font-size: 22px; }
#code-box { margin-top: 30px; padding: 20px; background: #f4f4f4; border-radius: 10px; word-break: break-all; font-family: monospace; font-size: 15px; }
button { margin-top: 16px; padding: 10px 20px; font-size: 15px; cursor: pointer; border: none; background: #ff0050; color: white; border-radius: 6px; }
button:hover { background: #d6003f; }
#msg { margin-top: 12px; color: green; font-size: 14px; }
</style>
</head>
<body>
<h1>Authorization successful ✅</h1>
<p>Copy the code below and paste it back into your terminal.</p>
<div id="code-box">Reading code...</div>
<button onclick="copyCode()">Copy Code</button>
<div id="msg"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const codeBox = document.getElementById("code-box");
  if (code) {
    codeBox.textContent = code;
  } else {
    codeBox.textContent = "No code found in URL. Please check the link or try again.";
  }

  function copyCode() {
    navigator.clipboard.writeText(codeBox.textContent).then(() => {
      document.getElementById("msg").textContent = "Copied to clipboard!";
    });
  }
</script>
</body>
</html>
